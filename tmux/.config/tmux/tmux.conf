# remaps super
unbind C-b
set -g prefix C-b
bind C-b send-prefix

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# if i create a new pane, the new pane should start out in the same wd as the pane i was just in
# split panes
bind d split-window -h -c "#{pane_current_path}"
bind D split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
# detach client (Ctrl-b Ctrl-d)
bind C-d detach-client
unbind '"'
unbind %

# reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux conf reloaded"

# navigate panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# resize panes (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind = select-layout even-vertical
bind | select-layout even-horizontal
bind t select-layout tiled
# rename the current pane (title in the top border)
bind N command-prompt -p "pane name:" -I "#{pane_title}" "select-pane -T '%%'"

######### DESIGN TWEAKS ##########
# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none
# copy mode
setw -g mode-style 'fg=colour252 bg=colour236 bold'
# Truecolor so pane labels can use the cream chips below.
set -as terminal-features ",*:RGB"
# panes — orange active / blue inactive borders (unchanged)
set -g pane-border-style 'fg=colour33'
set -g pane-active-border-style 'fg=colour208'
set -g pane-border-lines heavy
set -g pane-border-indicators arrows
set -g display-panes-colour colour33
set -g display-panes-active-colour colour208
set -g display-panes-time 1500
# Cream chip for the whole heading (index + optional scientist + title).
# Dark text on cream so you can read it at a glance. Active is bold.
set -g pane-border-status top
set -g pane-border-format ' #{?pane_active,#[fg=#101010#,bg=#f0e6d2#,bold],#[fg=#101010#,bg=#f0e6d2]} #P#{?@scientist, #{@scientist},} #{=/40/…:pane_title} #[default]'
# statusbar — orange chip is the active pane (scientist or index)
set -g status-justify left
set -g status-style 'fg=default bg=default'
set -g status-left '#[fg=#101010,bg=colour208,bold] #{?@scientist,#{@scientist},#P} #[default]'
set -g status-right '#[fg=colour242]#{pane_current_path}'
set -g status-left-length 20
set -g status-right-length 100
setw -g window-status-current-style 'fg=colour252 bg=colour236 bold'
setw -g window-status-current-format ' #I #W #F '
setw -g window-status-style 'fg=colour240 bg=default'
setw -g window-status-format ' #I #W #F '
setw -g window-status-bell-style 'fg=colour1 bg=default bold'
# messages
set -g message-style 'fg=colour252 bg=colour236 bold'

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# autosave
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# initialize tmux plugin manager (last line in config file)
run '~/.config/tmux/plugins/tpm/tpm'

# use vim kyebindings in copy mode
setw -g mode-keys vi 

# copy-pipe (not copy-pipe-and-cancel) keeps copy mode open after yank
if-shell 'test "$(uname -s)" = Darwin' {
  bind-key -T copy-mode-vi Enter send-keys -X copy-pipe 'pbcopy'
  bind-key -T copy-mode-vi y send-keys -X copy-pipe 'pbcopy'
  bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe 'pbcopy'
  bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe 'pbcopy'
  bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe 'pbcopy'
} {
  bind-key -T copy-mode-vi Enter send-keys -X copy-pipe 'xclip -i -selection clipboard'
  bind-key -T copy-mode-vi y send-keys -X copy-pipe 'xclip -i -selection clipboard'
  bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe 'xclip -i -selection clipboard'
  bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe 'xclip -i -selection clipboard'
  bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe 'xclip -i -selection clipboard'
}

set -g mouse on
set -g history-limit 55000

# hyperlinks>?>
set -as terminal-features ",*:hyperlinks" 
