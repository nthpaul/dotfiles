[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-local-orchestrator"
version = "0.1.0"
description = "Local durable coordinator and worker runtime"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.29,<2"]

[project.scripts]
codex-orch = "orchestrator.cli:main"
grok-bridge = "orchestrator.grok_api:main"

[tool.setuptools.package-data]
orchestrator = ["schema.sql"]

[tool.setuptools.packages.find]
include = ["orchestrator*"]
