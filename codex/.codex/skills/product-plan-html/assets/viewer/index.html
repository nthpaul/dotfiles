<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{PAGE_TITLE}}</title>
  <link rel="stylesheet" href="styles.css">
  <script src="spec.js" defer></script><script src="diagrams.js" defer></script>
  <script src="prototype.js" defer></script><script src="viewer.js" defer></script>
</head>
<body>
  <header class="review-header"><div class="brand"><span class="brand-mark">t</span><span>{{BRAND}} <span class="muted">/ product review</span></span></div><div class="review-meta"><span class="badge violet">Proposed</span><span>{{DATE}}</span><button id="theme-toggle" aria-label="Change color theme">Theme: system</button><a href="build-plan.md" download>Download plan ↗</a></div></header>
  <div class="review-title"><div><div class="eyebrow">{{EYEBROW}}</div><h1>{{TITLE}}</h1><p>{{SUBTITLE}}</p></div><div class="sample-label">Implementation plan<br><span class="muted">{{SAMPLE_LABEL}}</span></div></div>
  <nav class="review-tabs" aria-label="Plan and surface navigation"></nav>
  <div id="scenario-bar" class="scenario-bar" hidden><div><span class="eyebrow">TRY A SCENARIO</span><select id="scenario" aria-label="Preview scenario"></select></div><span id="scenario-status"></span><button data-action="reset" class="ghost">Reset demo</button></div>
  <main id="app"></main><div id="toast" role="status" aria-live="polite"></div><dialog id="modal"></dialog>
</body>
</html>
