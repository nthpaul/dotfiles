<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product plan</title>
  <style>
    {{FONT_FACES}}
    :root { color-scheme: light; --page-bg:#fff; --panel-bg:#fff; --ink:#08105e; --text:#414d58; --muted:#66788a; --line:#e2e5e9; --accent:#8000ff; --tint:#f5ebff; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { color-scheme:dark; --page-bg:#141720; --panel-bg:#1d2230; --ink:#f2f3f7; --text:#d7dde5; --muted:#a6b1c0; --line:#394252; --accent:#bf80ff; --tint:#30213f; }
    }
    :root[data-theme="dark"] { color-scheme:dark; --page-bg:#141720; --panel-bg:#1d2230; --ink:#f2f3f7; --text:#d7dde5; --muted:#a6b1c0; --line:#394252; --accent:#bf80ff; --tint:#30213f; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--page-bg); color:var(--text); font:400 14px/1.7 Poppins,sans-serif; }
    header, main { width:min(900px,100%); margin:auto; padding:24px; }
    header { display:flex; gap:16px; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); }
    main { padding-top:40px; padding-bottom:64px; }
    h1,h2,h3,strong { color:var(--ink); font-weight:600; }
    h1 { font-size:28px; line-height:1.3; margin:8px 0 20px; }
    h2 { font-size:18px; margin:28px 0 12px; }
    p { margin:12px 0; }
    a { color:var(--accent); text-underline-offset:3px; }
    button { font:inherit; color:var(--text); background:var(--panel-bg); border:1px solid var(--line); border-radius:8px; padding:8px 12px; cursor:pointer; }
    :focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
    .eyebrow { color:var(--muted); font-size:11px; letter-spacing:.08em; text-transform:uppercase; }
    .lead { color:var(--ink); font-size:17px; }
    .callout { background:var(--tint); border:1px solid var(--line); border-radius:12px; padding:16px 20px; margin:24px 0; }
    details { border-top:1px solid var(--line); margin-top:28px; padding-top:16px; }
    summary { color:var(--ink); cursor:pointer; }
    .table-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; }
    th,td { padding:12px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
    th { font-size:11px; text-transform:uppercase; color:var(--muted); }
    svg { max-width:100%; height:auto; }
    @media (max-width:600px) { header,main { padding:20px; } header { align-items:flex-start; flex-wrap:wrap; } h1 { font-size:24px; } }
  </style>
</head>
<body>
  <header><span class="eyebrow">Product plan · draft</span><button id="theme-toggle" type="button">Theme: system</button></header>
  <main>
    <div class="eyebrow">Proposed decision</div>
    <h1>Plan title</h1>
    <p class="lead">State the recommendation and the problem it solves.</p>
    <p>Explain the evidence and tradeoff the reader needs to assess this proposal.</p>
    <div class="callout"><strong>Next action</strong><p>State what the reader should decide or do next.</p></div>
  </main>
  <script>
    const modes = ['system','light','dark'];
    let mode = 'system';
    document.querySelector('#theme-toggle').addEventListener('click', event => {
      mode = modes[(modes.indexOf(mode) + 1) % modes.length];
      if (mode === 'system') delete document.documentElement.dataset.theme;
      else document.documentElement.dataset.theme = mode;
      event.currentTarget.textContent = 'Theme: ' + mode;
    });
  </script>
</body>
</html>
